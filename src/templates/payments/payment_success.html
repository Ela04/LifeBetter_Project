<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago Exitoso - LifeBetter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-success">
            <div class="card-header bg-success text-white text-center">
                <h3>¡Comprobante de Pago Confirmado!</h3>
            </div>
            <div class="card-body">
                <p><strong>Orden de Compra:</strong> {{ transaction.buy_order }}</p>
                <p><strong>Código de Autorización:</strong> {{ transaction.authorization_code }}</p>
                <p><strong>Monto Pagado:</strong> ${{ transaction.amount }}</p>
                <p><strong>Departamento:</strong> Depto {{ transaction.bill.department.number }}</p>
                <hr>
                <a href="/admin/" class="btn btn-primary w-100">Volver al Panel Principal</a>
            </div>
        </div>
    </div>
</body>
</html>
